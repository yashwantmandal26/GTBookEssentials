name: Build GTBOOK Essentials
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      GTBOOK_HEADLESS_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = ($tag -replace '^[vV]', '') -replace '[-+].*$', ''
          $parts = @($ver.Split('.') | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 4) { $parts += 0 }
          $asmVer = ($parts[0..3] -join '.')
          (Get-Content .\Build-Release.ps1 -Raw) -replace "\`$version\s*=\s*'[^']*'", "`$version='$ver'" | Set-Content .\Build-Release.ps1 -NoNewline
          $id = Get-Content .\src\AppIdentity.cs -Raw
          $id = $id -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$asmVer`")"
          $id = $id -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$asmVer`")"
          $id = $id -replace 'AssemblyInformationalVersion\("[^"]*"\)', "AssemblyInformationalVersion(`"$ver`")"
          $id | Set-Content .\src\AppIdentity.cs -NoNewline
      - name: Test and package
        shell: powershell
        run: .\Build-Release.ps1
      - name: Check one-file setup without installing
        shell: powershell
        run: |
          $setup = Start-Process -FilePath .\out\GTBOOK-Essentials-Setup.exe -ArgumentList '--check-only' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Setup preflight failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: GTBOOK-Essentials-windows
          path: |
            out/*.exe
            out/*.zip
            out/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem .\out\ -File | Where-Object { $_.Extension -in '.exe', '.zip', '.sha256' } | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "GTBOOK Essentials $tag" --generate-notes
          }
